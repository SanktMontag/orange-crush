# Streamlit Community Cloud puts apps to sleep after a stretch with no
# visitors. This opens the app in a real browser every 6 hours so it stays
# awake, and clicks "Yes, get this app back up!" if it fell asleep anyway.
#
# Setup: in the GitHub repo, go to Settings → Secrets and variables → Actions →
# Variables, and add STREAMLIT_APP_URL with the app's full https URL.
#
# GitHub pauses scheduled workflows in public repos after 60 days without a
# commit. If that happens, re-enable it from the Actions tab.

name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a headless browser
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Visit the app
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: python .github/scripts/keep_alive.py
